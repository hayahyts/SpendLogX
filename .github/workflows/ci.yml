name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Import stays reproducible
        # The seed is committed, so a change to the importer that alters the
        # output has to be reviewed rather than discovered later.
        run: |
          npm run import
          git diff --exit-code -- src/db/seed.json
